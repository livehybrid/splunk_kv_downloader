name: Splunk App CI/CD
on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  workflow_dispatch: {}
  schedule:
    # Weekly re-run of main, so it never goes stale unseen against new
    # Splunk, AppInspect and dependency releases. Tag-only jobs skip it.
    - cron: "54 5 * * 2"
permissions:
  pull-requests: write
  actions: write
  checks: write
# Cancel a superseded run on the same branch or pull request, so CI never
# spends time on code that has already been replaced. The default branch is
# never cancelled: every push there gets its own complete run, because a
# cancelled run on a branch that deploys or releases can let commits go out
# unchecked (haloclock-app, 13 Oct 2026).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Classic (non-UCC) app: the repo root IS the app content, so assemble it
      # under a kv_downloader/ dir and tar it into dist/ (the artifact the shared
      # appinspect / publish reusables consume).
      - name: Assemble + package app
        shell: bash
        run: |
          rm -rf stage dist && mkdir -p stage/kv_downloader dist
          cp -r bin default lib app.manifest README.md stage/kv_downloader/
          # Stamp <version>+<short sha> (and a build derived from the numeric part,
          # which must change every release) into the staged copy. The version is
          # the tag's, or the repo's on branch builds.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"
          else V=$(python3 -c "import configparser as c;p=c.ConfigParser(interpolation=None);p.read('default/app.conf');print(p['launcher']['version'])"); fi
          V="${V}+$(git rev-parse --short HEAD)"
          IFS=. read -r MAJ MIN PAT <<< "${V%%[-+]*}"
          if (( 10#$MIN > 99 || 10#${PAT:-0} > 99 )); then echo "::error::version $V does not fit the build scheme"; exit 1; fi
          BUILD=$(( 10#$MAJ * 10000 + 10#$MIN * 100 + 10#${PAT:-0} ))
          python3 - "$V" "$BUILD" <<'PY'
          import json, re, sys
          v, build = sys.argv[1], sys.argv[2]
          p = 'stage/kv_downloader/default/app.conf'; s = open(p).read()
          s = re.sub(r'(?m)^version = .*$', 'version = ' + v, s)
          s = re.sub(r'(?m)^\[install\]\n(build = .*\n)?', '', s).rstrip('\n') + '\n\n[install]\nbuild = ' + build + '\n'
          open(p, 'w').write(s)
          p = 'stage/kv_downloader/app.manifest'; m = json.load(open(p))
          m['info']['id']['version'] = v; json.dump(m, open(p, 'w'), indent=2)
          PY
          tar -C stage -czf "dist/kv_downloader-$V.tar.gz" kv_downloader
      - name: Verify package metadata
        # Read back from the tarball. The expected version comes from the ref (or
        # the repo's app.conf) and git, independently of the stamp step.
        shell: bash
        run: |
          export SHORT_SHA=$(git rev-parse --short HEAD)
          python3 - <<'PY'
          import configparser, glob, json, os, tarfile
          t, = glob.glob('dist/*.tar.gz'); tf = tarfile.open(t)
          c = configparser.ConfigParser(interpolation=None)
          c.read_string(tf.extractfile('kv_downloader/default/app.conf').read().decode())
          m = json.load(tf.extractfile('kv_downloader/app.manifest'))
          got = (c['launcher']['version'], c['id']['version'], c['install']['build'], m['info']['id']['version'])
          ref = os.environ.get('GITHUB_REF', '')
          if ref.startswith('refs/tags/v'):
              base = ref[len('refs/tags/v'):]
          else:
              r = configparser.ConfigParser(interpolation=None); r.read('default/app.conf')
              base = r['launcher']['version']
          v = base + '+' + os.environ['SHORT_SHA']
          maj, mn, pat = (v.split('+')[0].split('-')[0].split('.') + ['0'])[:3]
          want = (v, v, str(int(maj) * 10000 + int(mn) * 100 + int(pat)), v)
          print(t, got)
          assert got == want, '%s != %s' % (got, want)
          assert t.endswith('-' + v + '.tar.gz'), t
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  appinspect:
    name: quality-appinspect
    needs: package
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-cli.yml@main
    with:
      tags: "cloud,future,private_victoria"
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"

  quality-appinspect-api:
    # Splunk's hosted AppInspect (the vetting Splunkbase and Cloud run). The
    # estate calls the shared appinspect-api.yml with SPLUNKBASE_* repo
    # secrets; this repo has none, so the same action runs here with the
    # splunk.com login read from 1Password (the token this repo already holds).
    name: quality-appinspect-api
    needs: appinspect
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: 1password/install-cli-action@v2
      - name: Load splunk.com credentials from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        shell: bash
        run: |
          sb=$(op item get "splunkbase-credentials" --vault cicd --format json)
          u=$(echo "$sb" | jq -r '[.fields[] | select(.id=="username" or .purpose=="USERNAME") | .value][0] // empty')
          p=$(echo "$sb" | jq -r '[.fields[] | select(.id=="password" or .purpose=="PASSWORD") | .value][0] // empty')
          if [ -z "$u" ] || [ -z "$p" ]; then echo "::error::1Password item splunkbase-credentials needs username + password"; exit 1; fi
          # op values are not auto-masked like secrets.* are.
          echo "::add-mask::$u"
          echo "::add-mask::$p"
          { echo "SB_USER=$u"; echo "SB_PASS=$p"; } >> "$GITHUB_ENV"
      - name: Run AppInspect API
        uses: splunk/appinspect-api-action@v3.0
        with:
          username: ${{ env.SB_USER }}
          password: ${{ env.SB_PASS }}
          app_path: dist
          included_tags: private_victoria
          excluded_tags: offensive
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AppInspect_response.html
          path: AppInspect_response.html
          if-no-files-found: ignore

  integration-test:
    name: integration-test (splunk-docker)
    needs: package
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 10.0 is the oldest Splunk this add-on is tested on; 10.6.0 is current
        # (Postgres-backed KV store, Python 3.13 alongside 3.9).
        splunk: ["10.0", "10.6.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: Assemble app into stage/
        shell: bash
        run: |
          rm -rf stage && mkdir -p stage/kv_downloader
          cp -r bin default lib app.manifest README.md stage/kv_downloader/
          chmod -R 777 stage/kv_downloader
      - name: Start Splunk (wait for health)
        working-directory: docker
        env:
          SPLUNK_IMAGE_TAG: ${{ matrix.splunk }}
        run: docker compose up -d --wait --wait-timeout 360
      - name: Run integration suite
        env:
          SPLUNK_MGMT_URL: https://127.0.0.1:8089
          SPLUNK_USER: admin
          SPLUNK_PASSWORD: Changeme1!
          SPLUNK_CONTAINER: kv_downloader_splunk
        run: pytest tests/ -v -ra
      - name: Diagnostics on failure
        if: failure()
        working-directory: docker
        run: |
          docker exec kv_downloader_splunk /opt/splunk/bin/splunk search \
            'search index=_internal (source=*kvbackup* OR source=*kv_downloader* OR component=PersistentScript OR component=HttpListener) earliest=-15m | head 25 | table _time component _raw' \
            -auth admin:Changeme1! 2>&1 | head -40 || true
      - name: Tear down
        if: always()
        working-directory: docker
        run: docker compose down -v || true

  publish-gh:
    permissions:
      contents: write
    needs:
      - appinspect
      - integration-test
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish.yml@main
