name: Splunk App CI/CD
on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
permissions:
  pull-requests: write
  actions: write
  checks: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Classic (non-UCC) app: the repo root IS the app content, so assemble it
      # under a kv_downloader/ dir and tar it into dist/ (the artifact the shared
      # appinspect / publish reusables consume).
      - name: Assemble + package app
        shell: bash
        run: |
          rm -rf stage dist && mkdir -p stage/kv_downloader dist
          cp -r bin default lib app.manifest README.md stage/kv_downloader/
          tar -C stage -czf dist/kv_downloader.tar.gz kv_downloader
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  appinspect:
    name: quality-appinspect
    needs: package
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-cli.yml@main
    with:
      tags: "cloud,future,private_victoria"
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"

  integration-test:
    name: integration-test (splunk-docker)
    needs: package
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: Assemble app into stage/
        shell: bash
        run: |
          rm -rf stage && mkdir -p stage/kv_downloader
          cp -r bin default lib app.manifest README.md stage/kv_downloader/
          chmod -R 777 stage/kv_downloader
      - name: Start Splunk (wait for health)
        working-directory: docker
        run: docker compose up -d --wait --wait-timeout 360
      - name: Run integration suite
        env:
          SPLUNK_MGMT_URL: https://127.0.0.1:8089
          SPLUNK_USER: admin
          SPLUNK_PASSWORD: Changeme1!
          SPLUNK_CONTAINER: kv_downloader_splunk
        run: pytest tests/ -v -ra
      - name: Diagnostics on failure
        if: failure()
        working-directory: docker
        run: |
          docker exec kv_downloader_splunk /opt/splunk/bin/splunk search \
            'search index=_internal (source=*kvbackup* OR source=*kv_downloader* OR component=PersistentScript OR component=HttpListener) earliest=-15m | head 25 | table _time component _raw' \
            -auth admin:Changeme1! 2>&1 | head -40 || true
      - name: Tear down
        if: always()
        working-directory: docker
        run: docker compose down -v || true

  publish-gh:
    permissions:
      contents: write
    needs:
      - appinspect
      - integration-test
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish.yml@main
