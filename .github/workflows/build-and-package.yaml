name: Splunk App CI/CD
on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  workflow_dispatch: {}
  schedule:
    # Weekly re-run of main, so it never goes stale unseen against new
    # Splunk, AppInspect and dependency releases. Tag-only jobs skip it.
    - cron: "54 5 * * 2"
permissions:
  pull-requests: write
  actions: write
  checks: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Classic (non-UCC) app: the repo root IS the app content, so assemble it
      # under a kv_downloader/ dir and tar it into dist/ (the artifact the shared
      # appinspect / publish reusables consume).
      - name: Assemble + package app
        shell: bash
        run: |
          rm -rf stage dist && mkdir -p stage/kv_downloader dist
          cp -r bin default lib app.manifest README.md stage/kv_downloader/
          # Stamp the tag's version (and a build derived from it, which must change
          # every release) into the staged copy. Branch builds keep the repo version.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"
          else V=$(python3 -c "import configparser as c;p=c.ConfigParser(interpolation=None);p.read('default/app.conf');print(p['launcher']['version'])"); fi
          IFS=. read -r MAJ MIN PAT <<< "${V%%[-+]*}"
          if (( 10#$MIN > 99 || 10#${PAT:-0} > 99 )); then echo "::error::version $V does not fit the build scheme"; exit 1; fi
          BUILD=$(( 10#$MAJ * 10000 + 10#$MIN * 100 + 10#${PAT:-0} ))
          python3 - "$V" "$BUILD" <<'PY'
          import json, re, sys
          v, build = sys.argv[1], sys.argv[2]
          p = 'stage/kv_downloader/default/app.conf'; s = open(p).read()
          s = re.sub(r'(?m)^version = .*$', 'version = ' + v, s)
          s = re.sub(r'(?m)^\[install\]\n(build = .*\n)?', '', s).rstrip('\n') + '\n\n[install]\nbuild = ' + build + '\n'
          open(p, 'w').write(s)
          p = 'stage/kv_downloader/app.manifest'; m = json.load(open(p))
          m['info']['id']['version'] = v; json.dump(m, open(p, 'w'), indent=2)
          PY
          echo "V=$V" >> "$GITHUB_ENV"
          tar -C stage -czf "dist/kv_downloader-$V.tar.gz" kv_downloader
      - name: Verify package metadata
        # Read back from the tarball, independently of the stamp step.
        shell: bash
        run: |
          python3 - <<'PY'
          import configparser, glob, json, os, tarfile
          t, = glob.glob('dist/*.tar.gz'); tf = tarfile.open(t)
          c = configparser.ConfigParser(interpolation=None)
          c.read_string(tf.extractfile('kv_downloader/default/app.conf').read().decode())
          m = json.load(tf.extractfile('kv_downloader/app.manifest'))
          got = (c['launcher']['version'], c['id']['version'], c['install']['build'], m['info']['id']['version'])
          v = os.environ['V']
          maj, mn, pat = (v.split('+')[0].split('-')[0].split('.') + ['0'])[:3]
          want = (v, v, str(int(maj) * 10000 + int(mn) * 100 + int(pat)), v)
          print(t, got)
          assert got == want, '%s != %s' % (got, want)
          assert t.endswith('-' + os.environ['V'] + '.tar.gz'), t
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  appinspect:
    name: quality-appinspect
    needs: package
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-cli.yml@main
    with:
      tags: "cloud,future,private_victoria"
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"

  integration-test:
    name: integration-test (splunk-docker)
    needs: package
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 10.0 is the oldest Splunk this add-on is tested on; 10.6.0 is current
        # (Postgres-backed KV store, Python 3.13 alongside 3.9).
        splunk: ["10.0", "10.6.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: Assemble app into stage/
        shell: bash
        run: |
          rm -rf stage && mkdir -p stage/kv_downloader
          cp -r bin default lib app.manifest README.md stage/kv_downloader/
          chmod -R 777 stage/kv_downloader
      - name: Start Splunk (wait for health)
        working-directory: docker
        env:
          SPLUNK_IMAGE_TAG: ${{ matrix.splunk }}
        run: docker compose up -d --wait --wait-timeout 360
      - name: Run integration suite
        env:
          SPLUNK_MGMT_URL: https://127.0.0.1:8089
          SPLUNK_USER: admin
          SPLUNK_PASSWORD: Changeme1!
          SPLUNK_CONTAINER: kv_downloader_splunk
        run: pytest tests/ -v -ra
      - name: Diagnostics on failure
        if: failure()
        working-directory: docker
        run: |
          docker exec kv_downloader_splunk /opt/splunk/bin/splunk search \
            'search index=_internal (source=*kvbackup* OR source=*kv_downloader* OR component=PersistentScript OR component=HttpListener) earliest=-15m | head 25 | table _time component _raw' \
            -auth admin:Changeme1! 2>&1 | head -40 || true
      - name: Tear down
        if: always()
        working-directory: docker
        run: docker compose down -v || true

  publish-gh:
    permissions:
      contents: write
    needs:
      - appinspect
      - integration-test
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish.yml@main
